<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — MTG Set Tracker</title>
<link rel="stylesheet" href="styles.css?v=9">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <a class="back-link" href="index.html" title="All sets">←</a>
      <div class="brand-text">
        <h1 id="pName">Profile</h1>
        <span class="brand-sub" id="pSub"></span>
      </div>
    </div>
    <div class="topbar-right"><div id="account" class="account-bar"></div></div>
  </div>
</header>

<main class="page">
  <div id="status" class="status-state">Loading profile…</div>
  <div id="profileView" hidden>
    <section class="card-panel profile-head">
      <img id="pAvatar" class="profile-avatar" alt="" hidden>
      <div>
        <h2 id="pDisplay"></h2>
        <p id="pBio" class="muted"></p>
        <p id="pSummary" class="muted"></p>
      </div>
    </section>
    <section class="card-panel">
      <h2>Collection</h2>
      <div id="overview" class="overview-list"></div>
    </section>
  </div>
</main>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="mtg.js?v=2"></script>
<script src="sets-data.js?v=1"></script>
<script src="u.js?v=1"></script>
</body>
</html>
