<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTG Set Tracker</title>
<link rel="stylesheet" href="styles.css?v=11">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-mark">◈</span>
      <div class="brand-text">
        <h1>Magic: The Gathering</h1>
        <span class="brand-sub">Set Collection Tracker</span>
      </div>
    </div>
    <div class="topbar-right">
      <div id="account" class="account-bar"></div>
      <div class="progress-block">
        <div class="value-line"><strong id="setsTracked">0</strong> sets started · <strong id="cardsOwned">0</strong> cards in your collection</div>
      </div>
    </div>
  </div>
</header>

<div class="controls">
  <div class="controls-inner">
    <input type="search" id="search" placeholder="Search sets by name or code…" autocomplete="off">
    <label class="sort-label">Type
      <select id="typeFilter"></select>
    </label>
    <div class="filter-group" id="startedFilters">
      <button class="chip active" data-started="all">All sets</button>
      <button class="chip" data-started="started">Started</button>
    </div>
    <div class="spacer"></div>
    <label class="sort-label">Sort
      <select id="sort">
        <option value="new">Release (new→old)</option>
        <option value="old">Release (old→new)</option>
        <option value="name">Name</option>
        <option value="size">Card count</option>
        <option value="progress">Your progress</option>
      </select>
    </label>
  </div>
  <div class="controls-inner subrow">
    <span class="result-count" id="resultCount"></span>
    <span class="hint">Click a set to track your collection · progress is saved in this browser</span>
  </div>
</div>

<main id="grid" class="sets-grid" aria-live="polite"></main>
<div id="empty" class="empty-state" hidden>No sets match these filters.</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="mtg.js?v=3"></script>
<script src="sets-data.js?v=2"></script>
<script src="sets-app.js?v=3"></script>
</body>
</html>
